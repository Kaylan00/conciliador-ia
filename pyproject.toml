[project]
name = "conciliador-ia"
version = "0.1.0"
description = "Lê notas, recibos e extratos, concilia e sugere lançamentos contábeis com IA e revisão humana"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "pypdf>=5.0",
  "pypdfium2>=4.30",
  "pillow>=11.0",
  "numpy>=2.0",
  "scipy>=1.14",
  "opencv-python-headless>=4.10",
  "pytesseract>=0.3.13",
  "rapidfuzz>=3.10",
  "reportlab>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]
postgres = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
